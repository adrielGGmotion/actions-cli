name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Build release binaries
        shell: bash
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          mkdir dist
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64; do
            os="${target%/*}"
            arch="${target#*/}"
            dir="remote_${VERSION}_${os}_${arch}"
            mkdir "$dir"
            CGO_ENABLED=0 GOOS="$os" GOARCH="$arch" go build -trimpath -ldflags="-s -w" -o "$dir/remote" .
            tar -czf "dist/$dir.tar.gz" -C "$dir" remote
            rm -rf "$dir"
          done
          for arch in amd64 arm64; do
            dir="remote_${VERSION}_windows_${arch}"
            mkdir "$dir"
            CGO_ENABLED=0 GOOS=windows GOARCH="$arch" go build -trimpath -ldflags="-s -w" -o "$dir/remote.exe" .
            (cd "$dir" && zip -q "../dist/$dir.zip" remote.exe)
            rm -rf "$dir"
          done
          (cd dist && sha256sum * > checksums.txt)
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --verify-tag --generate-notes
